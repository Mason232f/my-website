<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css-files/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a81d867fa4.js" crossorigin="anonymous"></script>    
</head>
<body>
    <main>
        <header>
            <nav>
                <img class="headers_img" src="https://lh3.googleusercontent.com/a/ACg8ocKiw_fRoFz1rLrb46TFLhuFOZYqKWMIo6qL5r3uvmUqLrnuJbi5=s288-c-no" alt="Mason's Website img">
                <h1>Form Excercise</h1>
                <a class="nav_link" href="../index.html">Home Page</a>
            </nav>  
        </header>
        <form>
                <div>
                    <label for="fullName">Full Name</label>
                    <input type="text", id="fullName" name="fullName" placeholder="Jane Doe">
                </div>
                <div>
                    <label for="userEmail">Email</label>
                    <input type="email" name="userEmail" id="userEmail" placeholder="Email" required>
                </div>

                <button type="submit">Send Message</button>
        </form>
        <form action="POST">
            <!-- Radio Buttons -->
             <!-- use attribute "checked" to have the option checked by default -->
            <p>Radio Buttons</p>
            <input type="Radio" id="email" name="contact" value="email">
            <label for="email">Email</label>
            <input type="Radio" id="phone" name="contact" value="phone" checked>
            <label for="email">Phone</label>


            <!-- Checkboxes -->

            <p>Select your skills</p>
            <input type="checkbox" name="skills" id="html" value="html" checked>
            <label for="html">HTML</label>
            <input type="checkbox" name="skills" id="css" value="css">
            <label for="css">CSS</label>

            <!-- Text Area -->
            <div><label for="message"> Your Message:</label>
             <textarea name="message" value="message" id="message"
                            rows="10" cols="10"></textarea>
            </div>
             
            <!-- Dropdown Menus -->
             <label for="car">Choose a car</label>
             <select name="car" id="car">
                <option value="volvo">Volvo</option>
                <option value="toyota">Toyota</option>
                <option value="honda">Honda</option>
            </select>
        </form>
    </main>
</body>
</html>
